# /etc/nginx/conf.d/sendika-log-jetonsuz.conf
#
# Erisim log'u biçimi — JETONSUZ (http baglami; conf.d/*.conf Ubuntu'da
# http{} icine, sites-enabled'dan ONCE include edilir: nginx.conf satir 67 <
# 68). Kaynak: repo deploy/nginx/ — sunucuda elle degistirmeyin, repodan
# kopyalayin.
#
# NEDEN: davet / sifre sifirlama baglantilari adreste `token_hash=` tasir.
# Varsayilan `combined` biçimi $request'i (sorgu dahil) yazar → tek
# kullanimlik jeton log dosyasina, yedege, log toplayiciya duser. Burada
# sorgu `token_hash=` iceriyorsa yalniz yol + "?jeton-gizlendi" yazilir.
#
# 23 Eylul 2026'ya kadar bu uc parca nginx.conf'un icindeydi (satir 38-47).
# Oradan TASINDI — IKISI AYNI ANDA DURAMAZ: nginx "duplicate log_format"
# ile -t'de duser. access_log da bu dosyada: tanimdan ONCE kullanilamaz.
# Bu dosyaya bagli: sites-available/000-varsayilan-red (access_log …
# jetonsuz). nginx.conf'ta BASKA access_log satiri yok (olculdu).

map $request_uri $log_uri {
    "~^(?<yol>[^?]*)\?.*token_hash="  "$yol?jeton-gizlendi";
    default                            $request_uri;
}

log_format jetonsuz '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $log_uri $server_protocol" $status '
                    '$body_bytes_sent "$http_referer" "$http_user_agent"';

access_log /var/log/nginx/access.log jetonsuz;
