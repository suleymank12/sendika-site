# /etc/nginx/conf.d/sendika-gorsel-sinir.conf
#
# /_next/image hiz siniri BOLGESI (http baglami — conf.d/*.conf Ubuntu'da
# http{} icine include edilir). Kullanan: snippets/sendika-gorsel-ucu.conf.
# Kaynak: repo deploy/nginx/ — sunucuda elle degistirmeyin, repodan kopyalayin.
#
# Anahtar $binary_remote_addr: Cloudflare vekili KAPALI (karar, 21 Eylul
# 2026) — istemci IP'si dogrudan gorunuyor. Vekil acilirsa bu anahtar
# Cloudflare'in IP'si olur ve sinir tum ziyaretcilere BIRLIKTE uygulanir:
# o gun real_ip ayari sart.
#
# 10m bolge ~160 bin IP durumu tutar. Oran ve gerekce: gorsel-ucu dosyasi.

limit_req_zone $binary_remote_addr zone=sendika_gorsel:10m rate=10r/s;
