# /etc/nginx/conf.d/sendika-gzip.conf
#
# gzip — http duzeyinde TEK YER (23 Eylul 2026). Kaynak: repo deploy/nginx/ —
# sunucuda elle degistirmeyin, repodan kopyalayin.
#
# GERILEME (canlida olculdu): K7-A'dan beri /_next/static/ nginx'ten DISKTEN
# servis ediliyor (snippets/sendika-statik.conf). Sikistirma artik Next'te
# degil nginx'te; gzip_types yalniz platform dosyasinda (sites-available/
# sendika) vardi, musteri sablonunda yoktu, nginx.conf'ta yorum satirindaydi
# → musteri alan adlarinda JS/CSS SIKISTIRILMADAN gidiyordu
# (kurmayteknoloji.com: Content-Encoding yok; buyukdirilis.org.tr: gzip).
# Artik ayar http duzeyinde: platform, her musteri ve varsayilan red ayni.
#
# 🔴 `gzip on;` BURADA. Ubuntu'nun nginx.conf'unda da http{} icinde `gzip on;`
# vardir (satir 54) — ikisi birlikte `nginx -t`'de "directive is duplicate"
# ile duser (yerel nginx 1.18.0'da olculdu). Kurulumda nginx.conf'taki satir
# kaldirilir (KURULUM.md 8.1, NOTE.md "🔑 B2 kapanisi"). Site dosyalarina
# gzip satiri YAZILMAZ (test:nginx muhurlu).
#
# gzip_proxied varsayilan (off) BILEREK: istek bir vekilden (Via basligi)
# gelmedikce onemsiz; Cloudflare vekili kapali (karar, 21 Eylul 2026).
# Uygulamadan (proxy_pass) gelen yanitlari Next zaten sikistiriyor.

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml;
