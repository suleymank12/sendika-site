# /etc/nginx/snippets/sendika-uygulama.conf
#
# Uygulamaya (Next, PM2, 127.0.0.1:3000) giden HER istegin vekil ayarlari.
# Kullanan: her uygulama server blogunda `location /` ve
# snippets/sendika-gorsel-ucu.conf. Kaynak: repo deploy/nginx/.
#
# ⚠️ nginx'te bir location KENDI proxy_set_header'ini tanimlarsa ust
# seviyedekileri MIRAS ALMAZ — bu yuzden hepsi tek dosyada ve bu dosyayi
# include eden location'a baska proxy_set_header YAZILMAZ.

proxy_pass http://127.0.0.1:3000;
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# WebSocket KULLANILMIYOR (Supabase Realtime yok, HMR yalniz yerelde).
# Eskiden `Upgrade $http_upgrade` + `Connection 'upgrade'` iletiliyordu:
# GHSA-c4j6-fc7j-m34r (Next yerlesik sunucusunda upgrade uzerinden SSRF)
# bu yolu kullaniyor. Bos deger = baslik upstream'e HIC gonderilmez;
# `Connection ""` ayrica upstream keepalive'in dogru calismasini saglar.
proxy_set_header Upgrade "";
proxy_set_header Connection "";

# 🔴 IC BASLIKLAR DISARIDAN GELEMEZ. Bunlari yalniz middleware uretir;
# middleware'in CALISMADIGI yollarda (matcher disi: `api` ile baslayan her
# yol, /_next/*, /favicon.ico*) disaridan gelen deger oldugu gibi
# uygulamaya ulasiyordu. Olculdu (21 Eylul 2026, 14.2.35):
#   /apix + "x-tenant-slug: <baska kurum>"  → 404 BASKA KURUMUN adiyla
#   /apix + saldirgan CSP basligi           → nonce="zz\"zz" (nitelik kirilir,
#                                              GHSA-ffhc-5mcf-pf4q)
# x-middleware-subrequest: CVE-2025-29927 sinifi (14.2.25'te yamali;
# derinlemesine savunma). x-nextjs-data: GHSA-3g8h-86w9-wvmq (yalniz Pages
# Router kullanir, bizde yok).
proxy_set_header x-tenant-slug "";
proxy_set_header x-nonce "";
proxy_set_header Content-Security-Policy "";
proxy_set_header Content-Security-Policy-Report-Only "";
proxy_set_header x-middleware-subrequest "";
proxy_set_header x-nextjs-data "";
