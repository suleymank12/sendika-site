# /etc/nginx/snippets/sendika-gorsel-ucu.conf
#
# Next'in gorsel ucu (/_next/image) — server blogunun ICINE include edilir
# (location blogu tasir). On sart: conf.d/sendika-gorsel-sinir.conf
# (bolge tanimi) ve snippets/sendika-uygulama.conf. Kaynak: repo deploy/nginx/.
#
# NEDEN AYRI location: uc gorseli SUNUCUDA sharp'la isliyor; 1 cekirdek /
# 2 GB, tek PM2 prosesi, onde CDN yok. Bir onbellek iskalamasi 0,1-0,8 sn
# CPU (2,7 MB kapak ~0,8 sn, olculdu 20 Eylul).

location /_next/image {
    # (1) Kalite: sitede YALNIZ 75 kullaniliyor (next/image varsayilani +
    #     og:image zinciri; `quality=` prop'u kodda 0). Next 14'te
    #     `images.qualities` yok, q 1-100 serbest → varyant sayisi 100 kat.
    #     Bu satir onu 1'e indirir. `return` if icinde GUVENLI tek kullanim.
    #     q yoksa ya da "075"/"75.0" gibi yaziliyorsa da 400 (Next de q'yu
    #     zorunlu tutuyor). Rewrite asamasi hiz sinirindan ONCE calisir:
    #     400'ler kotayi yemez.
    if ($arg_q != "75") {
        return 400;
    }

    # (2) IP basina hiz siniri — bolge: conf.d/sendika-gorsel-sinir.conf
    #     (10 istek/sn). Gerekce (olculdu, 21 Eylul):
    #       - en kalabalik sayfa (anasayfa) 14 gorsel istegi; galeri albumu
    #         sinirsiz (tum fotograflar tek sayfada, lazy)
    #       - tarayici optimize gorseli 1 saat onbellekliyor
    #         (Cache-Control: public, max-age=3600) → donen ziyaretci tekrar
    #         istemiyor
    #       - sendika uyeleri isyeri NAT'i / mobil CGNAT arkasinda AYNI IP'yi
    #         paylasabilir → sinir cömert olmali
    #     burst=120 delay=60: oranin ustundeki ilk 60 istek BEKLEMEDEN gecer
    #     (≈4 anasayfa ayni anda), sonraki 60 kuyruga girip 10/sn hizinda
    #     yavaslatilir (kirik gorsel yerine gec gelen gorsel), 120'yi asan 429.
    #     Tek IP'den sureklilik: 10/sn = 600/dk. 429'lar error.log'a "limiting
    #     requests" diye WARN duser — mesru trafik takiliyor mu oradan bakilir.
    #     ⚠️ Bu sinir tek bir IP'yi durdurur; dagitik saldiriyi DURDURMAZ.
    #     Asil yapisal sinir varyant uzayi: yalniz bizim proje (remotePatterns)
    #     × q=75 × 16 genislik × 2 bicim.
    limit_req zone=sendika_gorsel burst=120 delay=60;
    limit_req_status 429;
    limit_req_log_level warn;

    include snippets/sendika-uygulama.conf;
}
