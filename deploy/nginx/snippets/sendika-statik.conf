# /etc/nginx/snippets/sendika-statik.conf
#
# 🔴 OFF-BY-SLASH UYARISI — okumadan DEGISTIRMEYIN:
# `location` satirinin sonundaki "/" ve `alias` degerinin sonundaki "/"
# IKISI DE ZORUNLU. Biri eksik olursa `/_next/static../<yol>` istegi alias
# dizininin BIR UST dizinine cozulur ve `.next/` alti (sunucu kodu,
# manifestler, BUILD_ID) disari acilir. Olculdu (21 Eylul 2026, yerel
# nginx 1.18.0): `location /_next/static { alias …/static/; }` →
# `/_next/static../BUILD_ID` 200 ve icerigi. Muhur: test:gorsel-zinciri.
#
# NE YAPAR: `/_next/static/` DISKTEN servis edilir. Olmayan dosya nginx'in
# kendi 404'unu alir ve uygulamaya (Next) HIC ulasmaz (K7-A). Eskiden bu yol
# `proxy_pass` ile uygulamaya gidiyordu ve sendika-uygulama.conf'u include
# ETMEDIGI icin gelen `x-tenant-slug` temizlenmiyordu; matcher disinda
# kaldigi icin middleware de calismiyordu → `kurmayteknoloji.com/_next/
# static/yok.js` + sahte baslik = baska kurumun kimligi (canlida olculdu).
#
# Kullanan: her uygulama server blogunda `include snippets/sendika-statik.conf;`
# Kaynak: repo deploy/nginx/. Dizin: deploy akisi `.next/static`'i
# standalone'a kopyalayip `/var/www/sendika-site/`'e rsync'liyor.
#
# - `^~`: ileride eklenebilecek bir regex location (ornegin `~* \.js$`) bu
#   blogu EZMESIN.
# - `try_files` BILEREK YOK: olmayan dosyada alias zaten 404 donuyor
#   (olculdu); alias + try_files trac #97'nin yanlis yol urettigi desen.
# - Cache-Control'de `always` BILEREK YOK: 404'e bir yillik `immutable`
#   yazilmasin — deploy sirasinda gecici 404 alan bir parca istemcide
#   kalici olarak zehirlenirdi. (`add_header` `always`'siz yalniz 2xx/3xx'e
#   eklenir.)
# - `nosniff` `always` ILE: Next statik yanitta bunu veriyordu; diskten
#   servis edilince kaybolmasin, 404'te de olsun.
# - ⚠️ Bu location kendi `add_header`'ini tanimladigi icin server
#   seviyesindeki `add_header`'lari (ornegin HSTS) MIRAS ALMAZ.

location ^~ /_next/static/ {
    alias /var/www/sendika-site/.next/static/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}
